<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
	<defs>
		<radialGradient id="bg" cx="50%" cy="42%" r="72%">
			<stop offset="0" stop-color="#0F1319"/>
			<stop offset="1" stop-color="#05070A"/>
		</radialGradient>
		<linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#2AA0DC"/>
			<stop offset="0.7" stop-color="#4CC2FF"/>
			<stop offset="1" stop-color="#7ED4FF"/>
		</linearGradient>
		<radialGradient id="dot" cx="50%" cy="50%" r="50%">
			<stop offset="0" stop-color="#BFE9FF"/>
			<stop offset="0.45" stop-color="#4CC2FF"/>
			<stop offset="1" stop-color="#4CC2FF" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<rect width="512" height="512" rx="128" fill="url(#bg)"/>

	<!-- scope rings + cardinal ticks -->
	<circle cx="256" cy="256" r="196" fill="none" stroke="#191E27" stroke-width="2"/>
	<circle cx="256" cy="256" r="150" fill="none" stroke="#12171F" stroke-width="2"/>
	<g stroke="#2A313D" stroke-width="3" stroke-linecap="round">
		<line x1="256" y1="52" x2="256" y2="76"/>
		<line x1="256" y1="436" x2="256" y2="460"/>
		<line x1="52" y1="256" x2="76" y2="256"/>
		<line x1="436" y1="256" x2="460" y2="256"/>
	</g>

	<!-- faint baseline -->
	<line x1="92" y1="256" x2="420" y2="256" stroke="#131922" stroke-width="2"/>

	<!-- live sensor pulse: flat, sensor ripple, one sharp spike, settle, end dot -->
	<polyline
		points="96,256 132,256 150,250 168,258 186,252 208,256 236,256 256,140 276,300 300,256 330,256 348,250 366,258 384,254 416,256"
		fill="none" stroke="url(#pulse)" stroke-width="11"
		stroke-linejoin="round" stroke-linecap="round"/>

	<!-- leading end-dot with glow (the brand signature) -->
	<circle cx="416" cy="256" r="26" fill="url(#dot)"/>
	<circle cx="416" cy="256" r="10" fill="#8FDBFF"/>
</svg>
